version: "0.1.0"
package: examples.pingpong
imports: []
events:
  - name: StartPing
    visibility: internal
    fields:
      - name: correlation_id
        type: string
  - name: PingRequested
    visibility: public
    version: "1.0.0"
    fields:
      - name: correlation_id
        type: string
  - name: PongReturned
    visibility: public
    version: "1.0.0"
    fields:
      - name: correlation_id
        type: string
  - name: PingTimedOut
    visibility: internal
    kind: signal
    fields:
      - name: correlation_id
        type: string
components:
  - name: Pinger
    state:
      fields:
        - name: outstanding
          type: map<string, string>
    ports:
      - name: command_in
        direction: in
        event: StartPing
      - name: request_out
        direction: out
        event: PingRequested
      - name: pong_in
        direction: in
        event: PongReturned
      - name: timeout_in
        direction: in
        event: PingTimedOut
    transitions:
      - name: start_ping
        on: StartPing
        writes: [outstanding]
        emits: [PingRequested]
      - name: finish_ping
        on: PongReturned
        reads: [outstanding]
        writes: [outstanding]
      - name: timeout_ping
        on: PingTimedOut
        reads: [outstanding]
        writes: [outstanding]
  - name: Ponger
    state:
      fields: []
    ports:
      - name: request_in
        direction: in
        event: PingRequested
      - name: response_out
        direction: out
        event: PongReturned
    transitions:
      - name: answer_ping
        on: PingRequested
        emits: [PongReturned]
  - name: PingProtocol
    uses:
      - name: pinger
        component: Pinger
      - name: ponger
        component: Ponger
    state:
      fields: []
    ports: []
    transitions: []
connections:
  - within: PingProtocol
    from: pinger.request_out
    to: ponger.request_in
    locality: non_local
  - within: PingProtocol
    from: ponger.response_out
    to: pinger.pong_in
    locality: non_local
