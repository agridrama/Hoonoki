version: "0.1.0"
events:
  - name: StartReliableSend
    visibility: internal
    fields:
      - name: message_id
        type: string
      - name: payload
        type: string
  - name: RetryTimeout
    visibility: internal
    kind: signal
    fields:
      - name: message_id
        type: string
  - name: PerfectLinkMessage
    visibility: public
    version: "1.0.0"
    fields:
      - name: message_id
        type: string
      - name: payload
        type: string
  - name: PerfectLinkAck
    visibility: public
    version: "1.0.0"
    fields:
      - name: message_id
        type: string
  - name: DeliverOnce
    visibility: internal
    fields:
      - name: message_id
        type: string
      - name: payload
        type: string
components:
  - name: PerfectSender
    state:
      fields:
        - name: pending
          type: map<string, string>
    ports:
      - name: start_in
        direction: in
        event: StartReliableSend
      - name: retry_in
        direction: in
        event: RetryTimeout
      - name: network_out
        direction: out
        event: PerfectLinkMessage
        contracts:
          must_reply: true
          retry:
            strategy: fixed_interval
          timeout:
            after: 3s
      - name: network_in
        direction: in
        event: PerfectLinkAck
    transitions:
      - name: start_send
        on: StartReliableSend
        writes:
          - pending
        emits:
          - PerfectLinkMessage
      - name: retry_send
        on: RetryTimeout
        reads:
          - pending
        writes:
          - pending
        emits:
          - PerfectLinkMessage
      - name: finish_send
        on: PerfectLinkAck
        reads:
          - pending
        writes:
          - pending
  - name: PerfectReceiver
    state:
      fields:
        - name: delivered
          type: map<string, string>
    ports:
      - name: network_in
        direction: in
        event: PerfectLinkMessage
      - name: ack_out
        direction: out
        event: PerfectLinkAck
      - name: deliver_out
        direction: out
        event: DeliverOnce
    transitions:
      - name: accept_new_message
        on: PerfectLinkMessage
        reads:
          - delivered
        writes:
          - delivered
        emits:
          - PerfectLinkAck
          - DeliverOnce
        requires:
          - "message has not been delivered before"
      - name: ack_duplicate_without_redelivery
        on: PerfectLinkMessage
        reads:
          - delivered
        emits:
          - PerfectLinkAck
        requires:
          - "message may already be present in delivered set"
connections:
  - from: PerfectSender.network_out
    to: PerfectReceiver.network_in
    contracts:
      delivery: retransmit_until_ack
      timeout:
        after: 3s
  - from: PerfectReceiver.ack_out
    to: PerfectSender.network_in
    contracts:
      delivery: at_least_once
actors:
  - name: sender-runtime
    components:
      - PerfectSender
  - name: receiver-runtime
    components:
      - PerfectReceiver
