version: "0.1.0"
package: examples.link
imports: []
events:
  - name: LinkSend
    visibility: public
    version: "1.0.0"
    fields:
      - name: message_id
        type: string
      - name: payload
        type: string
  - name: LinkDeliver
    visibility: public
    version: "1.0.0"
    fields:
      - name: message_id
        type: string
      - name: payload
        type: string
components:
  - name: StubbornLink
    doc: |
      Minimal lower-level link surface used as a composition dependency.
      This example does not claim full stubborn-link semantics.
    state:
      fields: []
    ports:
      - name: send_in
        direction: in
        event: LinkSend
      - name: deliver_out
        direction: out
        event: LinkDeliver
    transitions:
      - name: pass_through
        on: LinkSend
        emits: [LinkDeliver]
  - name: PerfectLink
    doc: |
      Composition-oriented example of wrapping a lower-level link.
      This spec is not yet the canonical semantic definition of perfect links.
      It exists to test where Hoonoki should draw the line between IDL-visible behavior
      and implementation/runtime semantics.
    uses:
      - name: sl
        component: StubbornLink
    state:
      fields:
        - name: delivered
          type: map<string, string>
    ports:
      - name: send_in
        direction: in
        event: LinkSend
      - name: deliver_out
        direction: out
        event: LinkDeliver
      - name: sl_send_out
        direction: out
        event: LinkSend
      - name: sl_deliver_in
        direction: in
        event: LinkDeliver
    transitions:
      - name: send_once
        on: LinkSend
        emits: [LinkSend]
      - name: accept_delivery
        on: LinkDeliver
        reads: [delivered]
        writes: [delivered]
        emits: [LinkDeliver]
connections:
  - within: PerfectLink
    from: self.sl_send_out
    to: sl.send_in
    locality: local
  - within: PerfectLink
    from: sl.deliver_out
    to: self.sl_deliver_in
    locality: local
